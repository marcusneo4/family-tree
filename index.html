<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Soon family</title>
    <meta name="theme-color" content="#EEF1EC">
    <meta name="description" content="The Soon family tree: find anyone, see how you are related, and what to call them.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="brand"><span class="seal seal-lg" aria-hidden="true">孙</span><span class="brand-name">Soon family</span></div>
        <div class="topbar-actions">
            <button type="button" class="btn btn-quiet btn-compact" id="photosBtn" aria-pressed="false"></button>
            <button type="button" class="icon-btn" id="menuBtn" aria-label="Menu" aria-haspopup="dialog">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
            </button>
        </div>
    </header>

    <main id="main" class="main">
        <section id="view-family" class="view" aria-label="Family view"></section>

        <section id="view-people" class="view" aria-label="People" hidden>
            <h1 class="sr-only" data-focus-target>People</h1>
            <div class="people-controls">
                <div class="searchbox">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
                    <input id="peopleSearch" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search by name">
                    <button type="button" class="icon-btn icon-btn-sm" id="peopleClear" aria-label="Clear search" hidden>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
                <div class="chips" id="peopleChips" role="group" aria-label="Filter by group"></div>
                <div class="people-tools">
                    <select id="branchSelect" aria-label="Branch"></select>
                    <div class="seg seg-sm" id="sortToggle" role="group" aria-label="Sort order">
                        <button type="button" data-sort="tree">Tree order</button>
                        <button type="button" data-sort="name">A to Z</button>
                    </div>
                </div>
                <p class="count-line" id="peopleStatus" role="status" aria-live="polite"></p>
            </div>
            <ul class="people-list" id="peopleList"></ul>
        </section>

        <section id="view-tree" class="view view-tree" aria-label="Family tree" hidden>
            <h1 class="sr-only" data-focus-target>Family tree</h1>
            <div class="chips chips-scroll" id="treeChips" role="group" aria-label="Show a branch"></div>
            <div class="tree-stage" id="treeStage" tabindex="0" role="region" aria-label="Family tree. Drag to move, pinch or scroll to zoom. Arrow keys move, plus and minus zoom.">
                <div class="tree-canvas" id="treeCanvas"></div>
                <div class="tree-controls">
                    <button type="button" class="icon-btn icon-btn-solid" id="zoomInBtn" aria-label="Zoom in"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                    <button type="button" class="icon-btn icon-btn-solid" id="zoomOutBtn" aria-label="Zoom out"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                    <button type="button" class="icon-btn icon-btn-solid" id="fitBtn" aria-label="Fit to screen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
                </div>
            </div>
        </section>
    </main>

    <nav class="tabbar" aria-label="Views">
        <button type="button" class="tab" data-view="family">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.6.1 4.5 1.8 4.5 4.3"/></svg>
            <span>Family</span>
        </button>
        <button type="button" class="tab" data-view="people">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
            <span>People</span>
        </button>
        <button type="button" class="tab" data-view="tree">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>
            <span>Tree</span>
        </button>
    </nav>

    <div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div>
    <input type="file" id="importInput" accept="application/json,.json" hidden>

    <dialog id="profileDlg" class="sheet" aria-label="Profile"></dialog>
    <dialog id="editDlg" class="sheet" aria-label="Add or edit a person"></dialog>
    <dialog id="photoDlg" class="sheet" aria-label="Family photos"></dialog>
    <dialog id="meDlg" class="sheet" aria-label="Who are you"></dialog>
    <dialog id="menuDlg" class="sheet" aria-label="Menu"></dialog>
    <dialog id="infoDlg" class="sheet" aria-label="Information"></dialog>
    <dialog id="quizDlg" class="sheet" aria-label="Photo quiz"></dialog>
    <dialog id="confirmDlg" class="sheet sheet-small" aria-label="Confirm"></dialog>

    <script src="core.js"></script>
    <script src="app.js"></script>
</body>
</html>
